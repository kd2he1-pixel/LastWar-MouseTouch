name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: LastWarMouseTouch_Android_Project_v1.3_READY
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        working-directory: LastWarMouseTouch_Android_Project_v1.3_READY
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Inspect APK
        working-directory: LastWarMouseTouch_Android_Project_v1.3_READY
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -n 30
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/arm64-v8a/libscreenrotation.so'

      - name: Rename APK
        working-directory: LastWarMouseTouch_Android_Project_v1.3_READY
        run: cp app/build/outputs/apk/release/app-release.apk ScreenRotation_MouseTouch_LastWar_v1.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRotation_MouseTouch_LastWar_v1.4
          path: LastWarMouseTouch_Android_Project_v1.3_READY/ScreenRotation_MouseTouch_LastWar_v1.4.apk
          if-no-files-found: error

      - name: Publish APK
        working-directory: LastWarMouseTouch_Android_Project_v1.3_READY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.4 --cleanup-tag -y || true
          gh release create v1.4 ScreenRotation_MouseTouch_LastWar_v1.4.apk \
            --title "화면 회전 + 마우스 터치 v1.4" \
            --notes "Galaxy Tab용 Last War 화면 회전 + 블루투스 마우스 터치 변환 APK. APK 서명 검증 및 네이티브 라이브러리 레거시 패키징 적용."
